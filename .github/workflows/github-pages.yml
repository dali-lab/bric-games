name: "Publish to GitHub Pages"
on:
  delete:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build and Export Game"
      # Re-publish once a cider-v* release has its -web.zip attached.
      - "Release Cider Quest"
    types:
      - completed

# Cancel any ongoing previous run if the job is re-triggered
concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  statuses: write

jobs:
  publish:
    name: Publish all branches to GitHub Pages
    runs-on: ubuntu-latest
    # "Release Cider Quest" also runs on every push to main (dev feed); only
    # its release runs change what Pages shows.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Release Cider Quest' || github.event.workflow_run.event == 'release' }}
    steps:
      - uses: endlessm/amalgamate-pages@v2
        with:
          workflow_name: "Build and Export Game"
          artifact_name: web
